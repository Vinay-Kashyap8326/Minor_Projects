<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="calculatorBox">
    <div id="headerArea">
      <a href="#">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </a>
      <div id="rightPart">
        <a href="#">
          <i class="fa-solid fa-ruler"></i>
        </a>
        <a href="#">
          <i class="fa-solid fa-square-root-variable"></i>
        </a>
      </div>
    </div>
    <div id="inputArea"></div>
    <div id="buttons">
      <button class="otherFunctions Clear">C</button>
      <button class="otherFunctions delete">
        <i class="fa-solid fa-delete-left"></i>
      </button>
      <button class="otherFunctions">%</button>
      <button class="operators">÷</button>
      <button class="numbers">7</button>
      <button class="numbers">8</button>
      <button class="numbers">9</button>
      <button class="operators">×</button>
      <button class="numbers">4</button>
      <button class="numbers">5</button>
      <button class="numbers">6</button>
      <button class="operators">–</button>
      <button class="numbers">1</button>
      <button class="numbers">2</button>
      <button class="numbers">3</button>
      <button class="operators">+</button>
      <button class="otherFunctions bracket">( )</button>
      <button class="numbers">0</button>
      <button class="numbers">.</button>
      <button class="equal">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
