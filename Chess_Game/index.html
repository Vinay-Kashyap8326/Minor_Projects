<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Match</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="boardWrap">
      <div id="board" class="board" aria-label="Chess board"></div>

      <div id="promoOverlay" class="overlay hidden">
        <div class="promoBox">
          <p>Promote pawn to</p>
          <div id="promoChoices" class="promoChoices"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <h1>Chess Match</h1>

      <div class="status">
        <span id="turnDot" class="dot white"></span>
        <span id="statusText">White to move</span>
      </div>

      <div class="controls">
        <button id="undoBtn" class="ctrl" type="button">Undo</button>
        <button id="flipBtn" class="ctrl" type="button">Flip</button>
        <button id="newBtn" class="ctrl primary" type="button">New Game</button>
      </div>

      <h2>Moves</h2>
      <div id="moves" class="moves"></div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
