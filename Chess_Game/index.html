<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Chess Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chessBoard">
        <div class="whitePiecesBox">
            <div class="whitebox rook whitePiece">
                <i class="fa-solid fa-chess-rook"></i>
            </div>
            <div class="blackbox knight whitePiece">
                <i class="fa-solid fa-chess-knight"></i>
            </div>
            <div class="whitebox bishop whitePiece">
                <i class="fa-solid fa-chess-bishop"></i>
            </div>
            <div class="blackbox king whitePiece">
                <i class="fa-solid fa-chess-king"></i>
            </div>
            <div class="whitebox queen whitePiece">
                <i class="fa-solid fa-chess-queen"></i>
            </div>
            <div class="blackbox bishop whitePiece">
                <i class="fa-solid fa-chess-bishop"></i>
            </div>
            <div class="whitebox knight whitePiece">
                 <i class="fa-solid fa-chess-knight"></i>
            </div>
            <div class="blackbox rook whitePiece">
                <i class="fa-solid fa-chess-rook"></i>
            </div>

            <div class="blackbox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn whitePiece"><i class="fa-solid fa-chess-pawn"></i></div>
        </div>
        
        <div class="middlePart">
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>

        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>

        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>

        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        <div class="blackbox"></div>
        <div class="whitebox"></div>
        </div>

        <div class="blackPiecesBox">
            <div class="whitebox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="whitebox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            <div class="blackbox pawn blackPiece"><i class="fa-solid fa-chess-pawn"></i></div>
            
            <div class="blackbox rook blackPiece">
              <i class="fa-solid fa-chess-rook"></i>
            </div>
            <div class="whitebox knight blackPiece">
                <i class="fa-solid fa-chess-knight"></i>
            </div>
            <div class="blackbox bishop blackPiece">
                <i class="fa-solid fa-chess-bishop"></i>
            </div>
            <div class="whitebox king blackPiece">
                <i class="fa-solid fa-chess-king"></i>
            </div>
            <div class="blackbox queen blackPiece">
                <i class="fa-solid fa-chess-queen"></i>
            </div>
            <div class="whitebox bishop blackPiece">
                <i class="fa-solid fa-chess-bishop"></i>
            </div>
            <div class="blackbox knight blackPiece">
                <i class="fa-solid fa-chess-knight"></i>
            </div>
            <div class="whitebox rook blackPiece">
                <i class="fa-solid fa-chess-rook"></i>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
